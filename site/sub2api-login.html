<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>使用 亿模亿样 账号登录 Sub2API</title>
  <base href="/">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="platform.css">
  <script src="runtime-config.js"></script>
  <script type="module" src="sub2api-login.js?v=wujisuan-1"></script>
</head>
<body>
  <main id="app" class="wrap">
    <h1>使用 亿模亿样 账号登录 Sub2API</h1>
    <p>统一登录会使用你的账号识别码、已验证邮箱、用户名和显示名称。亿模亿样 不会通过统一登录向 Sub2API 提供你的密码。</p>
    <p>模型调用按量从个人余额扣费，开通不会赠送余额。</p>
    <p id="sub2api-status" role="status"></p>
    <button id="sub2api-continue" class="btn primary" type="button" hidden>继续登录</button>
    <a class="btn" href="https://wujisuan.cc/login">返回 Sub2API 登录</a>
    <noscript>请启用 JavaScript 后重新发起登录。</noscript>
  </main>
</body>
</html>
