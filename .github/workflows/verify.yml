name: Verify the gallery

# Public CI never downloads, caches or uploads the private data package.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Verification never receives repository write permission.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
